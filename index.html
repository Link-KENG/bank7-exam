<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银行业从业资格 · 七套卷答题</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-nav="home">
      <span class="brand-mark">银</span>
      <span class="brand-text">七套卷答题<span class="brand-sub">银行业专业人员职业资格（初级）</span></span>
    </a>
    <nav class="topnav">
      <button class="nav-btn" data-nav="home">套卷</button>
      <button class="nav-btn" data-nav="history">历史记录</button>
    </nav>
  </div>
</header>

<main id="view-home" class="view">
  <section class="hero">
    <h1>银行业从业资格考试 · 七套卷</h1>
    <p>两大板块 · 各 7 套真题精选 · 每答一题立即给答案与解析 · 成绩自动存档</p>
    <div class="hero-stats" id="hero-stats"></div>
  </section>

  <section class="subject-block" id="subject-法规">
    <div class="subject-head">
      <div class="subject-title">
        <span class="subject-icon icon-blue">规</span>
        <div>
          <h2>法规</h2>
          <p class="subject-sub">银行业法律法规与综合能力（初级） · 单选80 + 多选30 + 判断15 · 满分100</p>
        </div>
      </div>
    </div>
    <div class="set-grid" id="grid-法规"></div>
  </section>

  <section class="subject-block" id="subject-个人理财">
    <div class="subject-head">
      <div class="subject-title">
        <span class="subject-icon icon-teal">财</span>
        <div>
          <h2>个人理财</h2>
          <p class="subject-sub">个人理财（初级） · 单选 + 多选 + 判断 · 满分100</p>
        </div>
      </div>
    </div>
    <div class="set-grid" id="grid-个人理财"></div>
  </section>
</main>

<main id="view-exam" class="view" hidden>
  <div class="exam-head">
    <button class="btn btn-ghost" id="exam-exit">← 退出</button>
    <div class="exam-meta">
      <div class="exam-title" id="exam-title"></div>
      <div class="exam-progress-row">
        <div class="progress"><div class="progress-bar" id="exam-bar"></div></div>
        <span class="exam-progress-text" id="exam-progress-text"></span>
      </div>
    </div>
    <button class="btn btn-danger" id="exam-submit">提前交卷</button>
  </div>
  <div class="exam-score-strip" id="exam-score-strip"></div>
  <div class="exam-body">
    <div class="q-card" id="q-card"></div>
  </div>
</main>

<main id="view-history" class="view" hidden>
  <section class="hero hero-small">
    <h1>历史记录</h1>
    <p>每次套卷考试的成绩都保存在本机浏览器中，点击可回顾每一道题</p>
    <div class="history-tools">
      <button class="btn" id="history-clear">清空全部记录</button>
    </div>
  </section>
  <div id="history-list" class="history-list"></div>
</main>

<main id="view-result" class="view" hidden>
  <section class="result-card">
    <div class="result-score" id="result-score"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-breakdown" id="result-breakdown"></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="result-review">查看错题回顾</button>
      <button class="btn" id="result-home">返回首页</button>
    </div>
  </section>
</main>

<main id="view-review" class="view" hidden>
  <div class="exam-head">
    <button class="btn btn-ghost" id="review-back">← 返回历史</button>
    <div class="exam-meta">
      <div class="exam-title" id="review-title"></div>
    </div>
    <button class="btn btn-primary" id="review-again">再做一次</button>
  </div>
  <div class="review-summary" id="review-summary"></div>
  <div class="review-body" id="review-body"></div>
</main>

<footer class="footer">题库来源：天一新奥《考点精析与上机题库》七套卷 · 数据由 PDF 解析生成，仅供学习参考</footer>

<script src="js/app.js"></script>
</body>
</html>
